<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Clientes — Zynnos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ══ TOKENS — WEB (verde, punto de partida) ══ */
:root {
  --web-bg:     #0e1a13;
  --web-lime:   #c8f135;
  --web-teal:   #34c994;
  --web-fg:     #f0ede6;
  --web-surface:#1a2e1f;

  /* PORTAL (naranja, destino) */
  --p-bg:       #110d08;
  --p-surface:  #1a120b;
  --p-overlay:  #2a1e10;
  --p-border:   rgba(255,107,53,.18);
  --p-border-2: rgba(255,107,53,.32);
  --p-fg:       #fff5e9;
  --p-fg-2:     #c49a72;
  --p-fg-3:     #6b4a2a;
  --p-orange:   #FF6B35;
  --p-orange-2: #FF8C5A;
  --p-orange-dk:#CC4E1A;
  --p-orange-glow: rgba(255,107,53,.38);
  --p-orange-dim:  rgba(255,107,53,.14);
  --p-cream:    #FFF3C4;
  --p-teal:     #34c994;
  --p-teal-dim: rgba(52,201,148,.12);
  --p-shadow-lg:0 8px 40px rgba(180,60,10,.30), 0 2px 8px rgba(60,20,5,.35);
  --p-glow:     0 0 30px rgba(255,107,53,.20);

  --ff:   'Inter', system-ui, sans-serif;
  --ff-d: 'Space Grotesk', system-ui, sans-serif;
  --r:    .5rem;
  --r-lg: .85rem;
  --r-xl: 1.1rem;
  --t:    .18s cubic-bezier(.4,0,.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ══ TRANSICIÓN DE FONDO ══ */
html, body {
  min-height: 100vh;
  font-family: var(--ff);
}

body {
  background: var(--web-bg);       /* empieza en verde */
  color: var(--web-fg);
  transition: background 1.1s cubic-bezier(.4,0,.2,1),
              color .6s ease;
}

body.portal-mode {
  background: var(--p-bg);         /* termina en naranja oscuro */
  color: var(--p-fg);
}

/* ══ CAPA DE TRANSICIÓN VISUAL ══ */
.transition-overlay {
  position: fixed; inset: 0; z-index: 100;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse 60% 40% at 50% 50%,
    rgba(255,107,53,.18) 0%, transparent 70%);
  transition: opacity 1s ease;
}
body.portal-mode .transition-overlay { opacity: 1; }

/* ══ MESH GRADIENT BACKGROUND ══ */
.bg-mesh {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%,
      rgba(255,107,53,.10) 0%, transparent 65%),
    radial-gradient(ellipse 40% 30% at 90% 80%,
      rgba(255,243,196,.04) 0%, transparent 55%);
  transition: opacity 1.2s ease;
}
body.portal-mode .bg-mesh { opacity: 1; }

/* ══ BARRA NAV ══ */
.nav {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  background: rgba(14,26,19,.85);        /* web verde */
  border-bottom: 1px solid rgba(200,241,53,.08);
  transition: background 1.1s cubic-bezier(.4,0,.2,1),
              border-color .8s ease;
}
body.portal-mode .nav {
  background: rgba(17,13,8,.88);         /* portal naranja */
  border-bottom: 1px solid rgba(255,107,53,.12);
}
/* Línea degradé superior */
.nav::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--web-lime) 0%, var(--web-teal) 100%);
  transition: background 1.2s ease;
}
body.portal-mode .nav::before {
  background: linear-gradient(90deg, var(--p-orange) 0%, var(--p-teal) 100%);
}
.nav-inner {
  max-width: 900px; margin: 0 auto;
  display: flex; align-items: center; gap: .75rem;
  padding: .7rem 1.25rem;
}
.brand-pill {
  font-family: var(--ff-d); font-weight: 700; font-size: .78rem;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--web-lime);
  background: rgba(200,241,53,.1);
  border: 1px solid rgba(200,241,53,.2);
  border-radius: 20px; padding: .25rem .7rem;
  text-decoration: none;
  transition: color .8s ease, background .8s ease, border-color .8s ease;
}
body.portal-mode .brand-pill {
  color: var(--p-orange);
  background: rgba(255,107,53,.1);
  border-color: rgba(255,107,53,.25);
}
.sep { color: rgba(255,255,255,.25); font-size: .8rem; }
.portal-pill {
  font-family: var(--ff-d); font-weight: 600; font-size: .72rem;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--p-fg-2, #c49a72);
  background: var(--p-orange-dim, rgba(255,107,53,.14));
  border: 1px solid var(--p-border, rgba(255,107,53,.18));
  border-radius: 20px; padding: .22rem .65rem;
}

/* ══ CONTENIDO PRINCIPAL ══ */
main {
  position: relative; z-index: 1;
  min-height: calc(100vh - 56px);
  display: flex; align-items: center; justify-content: center;
  padding: 2rem 1rem;
}

/* ══ CARD DE LOGIN ══ */
.login-wrap {
  width: 100%; max-width: 390px;
  animation: fadeUp .5s cubic-bezier(.4,0,.2,1) both;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(16px) }
  to   { opacity:1; transform:none }
}

.login-logo {
  text-align: center; margin-bottom: 2rem;
}
.logo-orb {
  width: 56px; height: 56px; border-radius: 1rem;
  margin: 0 auto 1.1rem;
  background: linear-gradient(135deg, var(--p-orange) 0%, var(--p-orange-dk) 100%);
  box-shadow: 0 0 32px var(--p-orange-glow), 0 4px 16px rgba(180,60,10,.3);
  display: flex; align-items: center; justify-content: center;
  /* empieza verde, transiciona a naranja */
  opacity: 0;
  transform: scale(.8);
  transition: opacity .6s .3s ease, transform .6s .3s cubic-bezier(.34,1.56,.64,1);
}
body.portal-mode .logo-orb {
  opacity: 1;
  transform: scale(1);
}
.logo-title {
  font-family: var(--ff-d); font-weight: 700; font-size: 1.3rem;
  letter-spacing: -.01em;
  background: linear-gradient(135deg, var(--p-fg) 40%, var(--p-orange-2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.logo-sub {
  color: var(--p-fg-3); font-size: .82rem; margin-top: .35rem; letter-spacing: .01em;
}

/* Spinner de carga inicial */
.loading-state {
  display: flex; flex-direction: column; align-items: center;
  gap: 1rem; padding: 2rem;
  opacity: 1; transition: opacity .4s ease;
}
.loading-state.hidden { opacity: 0; pointer-events: none; height: 0; overflow: hidden; }
.spinner {
  width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid rgba(200,241,53,.15);
  border-top-color: var(--web-lime);
  animation: spin .7s linear infinite;
  transition: border-color .8s ease, border-top-color .8s ease;
}
body.portal-mode .spinner {
  border-color: rgba(255,107,53,.15);
  border-top-color: var(--p-orange);
}
@keyframes spin { to { transform: rotate(360deg) } }
.loading-text {
  font-size: .85rem; color: var(--web-fg);
  opacity: .6; letter-spacing: .02em;
  transition: color .8s ease;
}
body.portal-mode .loading-text { color: var(--p-fg-2); }

/* Form card */
.form-card {
  background: var(--p-surface);
  border: 1px solid var(--p-border-2);
  border-radius: var(--r-xl);
  padding: 2rem 2rem 1.75rem;
  box-shadow: var(--p-shadow-lg), var(--p-glow);
  opacity: 0; transform: translateY(12px);
  transition: opacity .5s ease, transform .5s cubic-bezier(.4,0,.2,1);
}
.form-card.visible { opacity: 1; transform: none; }

.field { margin-bottom: 1.1rem; }
.field label {
  display: block; font-size: .78rem; font-weight: 600;
  color: var(--p-fg-3); letter-spacing: .04em;
  text-transform: uppercase; margin-bottom: .5rem;
}
.field input {
  width: 100%; padding: .65rem 1rem;
  border-radius: var(--r);
  background: var(--p-overlay); border: 1.5px solid var(--p-border);
  color: var(--p-fg); font-size: .93rem; outline: none;
  font-family: var(--ff);
  transition: border-color var(--t), box-shadow var(--t);
}
.field input:focus {
  border-color: var(--p-orange);
  box-shadow: 0 0 0 3px rgba(255,107,53,.14);
}
.field input::placeholder { color: var(--p-fg-3); opacity: .5; }

.field-last { margin-bottom: 1.75rem; }

.btn-primary {
  width: 100%; padding: .72rem;
  display: flex; align-items: center; justify-content: center; gap: .5rem;
  font-family: var(--ff-d); font-weight: 600; font-size: .9rem;
  letter-spacing: .01em; cursor: pointer;
  border: none; border-radius: var(--r);
  background: linear-gradient(135deg, var(--p-orange) 0%, var(--p-orange-dk) 100%);
  color: #fff;
  box-shadow: 0 4px 16px rgba(255,107,53,.35);
  transition: opacity var(--t), transform var(--t), box-shadow var(--t);
  position: relative; overflow: hidden;
}
.btn-primary:hover:not(:disabled) {
  opacity: .92; transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(255,107,53,.45);
}
.btn-primary:active { transform: scale(.98); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }

/* Loading spinner dentro del botón */
.btn-spinner {
  display: none; width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
  animation: spin .6s linear infinite;
}
.btn-primary.loading .btn-text { display: none; }
.btn-primary.loading .btn-spinner { display: block; }

/* Alerta de error */
.alert {
  display: none; padding: .75rem 1rem;
  background: rgba(240,92,110,.12);
  border: 1px solid rgba(240,92,110,.3);
  border-radius: var(--r); color: #f7a0aa;
  font-size: .84rem; margin-bottom: 1rem;
  animation: fadeUp .3s ease;
}
.alert.show { display: block; }

/* Footer del form */
.form-footer {
  text-align: center; color: var(--p-fg-3);
  font-size: .78rem; margin-top: 1.5rem; line-height: 1.6;
}

/* Mobile */
@media (max-width: 480px) {
  .login-wrap { max-width: 100%; }
  .form-card { padding: 1.5rem 1.25rem; }
}
</style>
</head>

<body>
<div class="bg-mesh"></div>
<div class="transition-overlay"></div>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand-pill">Zynnos</a>
    <span class="sep">/</span>
    <span class="portal-pill">PORTAL</span>
  </div>
</nav>

<!-- MAIN -->
<main>
  <div class="login-wrap">

    <!-- Estado de carga / transición -->
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <div class="loading-text">Accediendo al portal…</div>
    </div>

    <!-- Logo -->
    <div class="login-logo" id="loginLogo" style="display:none;">
      <div class="logo-orb">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5z" fill="rgba(255,255,255,.9)"/>
          <path d="M2 17l10 5 10-5" stroke="rgba(255,255,255,.7)" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M2 12l10 5 10-5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="logo-title">Zynnos Portal</div>
      <div class="logo-sub">Acceso exclusivo para clientes</div>
    </div>

    <!-- Form card -->
    <div class="form-card" id="formCard" style="display:none;">
      <div class="alert" id="alertMsg"></div>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email"
                 autocomplete="email" required placeholder="tu@email.com">
        </div>
        <div class="field field-last">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" required placeholder="········">
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">
          <span class="btn-text" style="display:flex;align-items:center;gap:.5rem;">
            Ingresar al portal
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
          <div class="btn-spinner"></div>
        </button>
      </form>
    </div>

    <p class="form-footer" id="formFooter" style="display:none;">
      ¿No tenés acceso? Tu gestor en Zynnos<br>te envía las credenciales por email.
    </p>

  </div>
</main>

<script>
const CENTRAL = 'https://central-gh9z.onrender.com';

// ── Secuencia de entrada ─────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  // 1. Mostrar spinner verde brevemente (simula "entrando a sección")
  setTimeout(() => {
    // 2. Disparar transición de color: verde → naranja
    document.body.classList.add('portal-mode');

    // 3. Después de la transición, mostrar el form
    setTimeout(() => {
      const ls = document.getElementById('loadingState');
      const logo = document.getElementById('loginLogo');
      const card = document.getElementById('formCard');
      const footer = document.getElementById('formFooter');

      ls.classList.add('hidden');
      setTimeout(() => {
        ls.style.display = 'none';
        logo.style.display = 'block';
        card.style.display = 'block';
        footer.style.display = 'block';
        // Trigger animación del orb
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            card.classList.add('visible');
          });
        });
      }, 400);
    }, 900);
  }, 600);
});

// ── Login ────────────────────────────────────────────────────────────────────
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const btn   = document.getElementById('loginBtn');
  const alert = document.getElementById('alertMsg');
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;

  btn.classList.add('loading');
  btn.disabled = true;
  alert.classList.remove('show');

  try {
    const res = await fetch(CENTRAL + '/portal/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email, password: pass }),
    });

    const data = await res.json();

    if (res.ok && data.ok) {
      // Redirigir al portal en la central
      window.location.href = CENTRAL + '/portal/';
    } else {
      alert.textContent = data.error || 'Email o contraseña incorrectos.';
      alert.classList.add('show');
    }
  } catch (err) {
    alert.textContent = 'Error de conexión. Intentá de nuevo.';
    alert.classList.add('show');
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
